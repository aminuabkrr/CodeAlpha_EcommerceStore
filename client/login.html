<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In — CodeAlpha Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav class="navbar"><div id="main-nav"></div></nav>

  <section class="section">
    <div class="container">
      <div class="form-card">
        <h1 style="margin-bottom: 1.5rem;">Log in</h1>
        <div id="login-alert" aria-live="polite"></div>

        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input type="email" id="email" class="form-input" required>
            <div class="form-error" id="email-error"></div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <input type="password" id="password" class="form-input" required>
            <div class="form-error" id="password-error"></div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
        </form>

        <p style="margin-top: 1.25rem; font-size: 0.875rem; color: var(--ink-soft);">
          Don't have an account? <a href="register.html" style="color: var(--cobalt);">Register</a>
        </p>
      </div>
    </div>
  </section>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', initLoginForm);
  </script>
</body>
</html>
